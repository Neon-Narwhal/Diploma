name: "cfg_basic_analysis"
description: "Анализ сложности на основе Control Flow Graph"

data:
  train_path: "data/bigobench_mapped/train.jsonl"
  val_path: "data/bigobench_mapped/val.jsonl"
  test_path: "data/bigobench_mapped/test.jsonl"
  code_field: "code"
  label_field: "time_complexity_mapped"
  
  preprocessing:
    min_code_length: 10
    max_samples_per_split: 10000

processing:
  batch_size: 100
  parallel: true
  n_workers: 4
  timeout_per_sample: 15 # CFG построение чуть медленнее

analyzers:
  - name: "cfg_basic"
    type: "cfg_basic" # Ссылается на @register_analyzer('cfg_basic')
    params: {}

evaluation_metrics:
  - "f1_macro"
  - "recall_macro"
  - "accuracy"
  - "precision_macro"

save_results: true
output_path: "outputs/cfg_analysis/basic_results.jsonl"
generate_report: true
