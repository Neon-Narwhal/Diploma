name: "ast_advanced_analysis"
description: "Продвинутый AST анализ с детекцией паттернов"

data:
  train_path: "data/bigobench_mapped/train.jsonl"
  val_path: "data/bigobench_mapped/val.jsonl"
  test_path: "data/bigobench_mapped/test.jsonl"
  code_field: "code"
  label_field: "time_complexity_mapped"
  
  preprocessing:
    min_code_length: 10
    max_samples_per_split: 10000

processing:
  batch_size: 100
  parallel: true
  n_workers: 4
  timeout_per_sample: 10

analyzers:
  - name: "ast_advanced"
    type: "advanced"
    params:
      track_all_nodes: true

evaluation_metrics:
  - "f1_macro"
  - "recall_macro"
  - "accuracy"
  - "precision_macro"

save_results: true
output_path: "outputs/ast_analysis/advanced_results.jsonl"
generate_report: true
