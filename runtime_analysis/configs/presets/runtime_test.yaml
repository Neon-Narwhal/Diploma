name: "runtime_test"
description: "Runtime Analysis Test (динамическое выполнение кода)"

data:
  train_path: "data/bigobench_mapped/train.jsonl"
  val_path: "data/bigobench_mapped/val.jsonl"
  test_path: "data/bigobench_mapped/test.jsonl"
  code_field: "code"
  label_field: "time_complexity_mapped"
  
  preprocessing:
    min_code_length: 10
    max_samples_per_split: 10000

processing:
  batch_size: 10
  parallel: false  # КРИТИЧНО: отключаем, так как Runtime сам использует multiprocessing
  n_workers: 1
  timeout_per_sample: 10

analyzers:
  - name: "runtime"
    type: "runtime"
    params:
      timeout: 1.0

evaluation_metrics:
  - "accuracy"
  - "f1_macro"
  - "recall_macro"
  - "precision_macro"

save_results: true
output_path: "outputs/runtime_analysis/results.jsonl"
generate_report: true
