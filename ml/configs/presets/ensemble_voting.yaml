name: "voting_ensemble"
description: "Voting ensemble из CatBoost и XGBoost"

models:
  - name: "voting_ensemble"
    type: "voting"
    params:
      voting: "soft"
      models:
        - name: "catboost"
          type: "catboost"
          params:
            boosting_type: "catboost"
            iterations: 1000
            depth: 6
            learning_rate: 0.03
            
        - name: "xgboost"
          type: "xgboost"
          params:
            boosting_type: "xgboost"
            n_estimators: 1000
            max_depth: 6
            learning_rate: 0.03

features:
  extractors:
    - complexity
  transformer_method: "standard"

cross_validation:
  enabled: true
  n_folds: 5
  stratified: true

evaluation_metrics:
  - accuracy
  - f1_macro

save_models: true
generate_report: true
