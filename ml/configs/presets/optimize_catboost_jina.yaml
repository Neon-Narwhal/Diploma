name: "optimize_catboost_jina_50к"
description: "CatBoost на Jina V2 эмбеддингах"

data:
  train_path: "data/bigobench_mapped/train.jsonl"
  val_path: "data/bigobench_mapped/val.jsonl"
  test_path: "data/bigobench_mapped/test.jsonl"
  code_field: "code"
  label_field: "time_complexity_mapped"
  
  preprocessing:
    min_code_length: 10
    # Ограничиваем выборку для теста скорости нейросети
    max_samples_per_split: 50000 
  
  features:
    type: "hybrid"    
    remove_constant: true
    model_name: "jinaai/jina-embeddings-v2-base-code"
    batch_size: 8
    max_length: 1024
    device: "cuda"

models:
  - name: "catboost_jina_50k"
    type: "catboost"
    params:
      loss_function: "MultiClass"
      task_type: "GPU"
      devices: "0"
      verbose: false

optimization:
  enabled: true
  n_trials: 30
  timeout: 3600
  metric: "f1_macro"
  search_space:
    learning_rate:
      type: "float"
      low: 0.01
      high: 0.2
      log: true
    depth:
      type: "int"
      low: 4
      high: 8
    l2_leaf_reg:
      type: "float"
      low: 1
      high: 10
    iterations:
      type: "int"
      low: 500
      high: 1500

save_models: true
generate_report: true
