name: "debug_ast_50k_v1"
description: "Проверка AST признаков на 50к примерах (Sanity Check)"

data:
  train_path: "data/bigobench_mapped/train.jsonl"
  val_path: "data/bigobench_mapped/val.jsonl"
  test_path: "data/bigobench_mapped/test.jsonl"
  code_field: "code"
  label_field: "time_complexity_mapped"
  
  preprocessing:
    min_code_length: 10
    max_samples_per_split: 50000  # Тот же объем, что и в упавшем эксперименте
  
  features:
    type: "complexity"        # ТОЛЬКО AST + TF-IDF (без нейросетей)
    max_tfidf_features: 500   # Немного слов для контекста
    remove_constant: true

models:
  - name: "catboost_debug_ast"
    type: "catboost"
    params:
      loss_function: "MultiClass"
      task_type: "GPU"
      devices: "0"
      verbose: false
      
      # Балансировка включена, чтобы проверить, ломает ли она обучение на чистых данных
      auto_class_weights: "Balanced" 

# Оптимизацию можно выключить или сделать минимальной, 
# нам главное увидеть baseline метрики
optimization:
  enabled: true
  n_trials: 15
  timeout: 1800
  metric: "f1_macro"
  search_space:
    learning_rate:
      type: "float"
      low: 0.01
      high: 0.2
      log: true
    depth:
      type: "int"
      low: 4
      high: 8
    l2_leaf_reg:
      type: "float"
      low: 1
      high: 10
    iterations:
      type: "int"
      low: 500
      high: 1500

# Метрики для оценки по Стандарту
evaluation_metrics:
  - f1_macro
  - recall_macro
  - accuracy
  - precision_macro

save_models: true
generate_report: true
