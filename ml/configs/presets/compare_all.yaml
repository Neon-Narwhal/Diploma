name: "compare_all_boosting"
description: "Сравнение CatBoost, XGBoost, LightGBM"

data:
  train_path: "data/bigobench_mapped/train.jsonl"
  val_path: "data/bigobench_mapped/val.jsonl"
  test_path: "data/bigobench_mapped/test.jsonl"
  code_field: "code"
  label_field: "time_complexity_mapped"
  
  preprocessing:
    min_code_length: 10
    max_samples_per_split: 5000

models:
  - name: "catboost"
    type: "catboost"
    params:
      iterations: 1000
      depth: 6
      learning_rate: 0.03
      task_type: "GPU"
      devices: "0"
      
  - name: "xgboost"
    type: "xgboost"
    params:
      n_estimators: 1000
      max_depth: 6
      learning_rate: 0.03
      task_type: "gpu_hist"
      device: "cuda" 
      
  - name: "lightgbm"
    type: "lightgbm"
    params:
      n_estimators: 1000
      max_depth: 6
      learning_rate: 0.03
      device: "gpu" 

features:
  extractors:
    - complexity
  transformer_method: "standard"
  selector_method: "mutual_info"
  n_features: 50

# CV больше не обязателен, если есть val set
cross_validation:
  enabled: false

evaluation_metrics:
  - accuracy
  - f1_macro
  - f1_micro
  - precision_macro
  - recall_macro

save_models: false
save_predictions: false
generate_report: true
