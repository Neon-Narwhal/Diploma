name: "optimize_lightgbm_gpu"
description: "Оптимизация LightGBM на GPU"

data:
  train_path: "data/bigobench_mapped/train.jsonl"
  val_path: "data/bigobench_mapped/val.jsonl"
  test_path: "data/bigobench_mapped/test.jsonl"
  code_field: "code"
  label_field: "time_complexity_mapped"
  preprocessing:
    min_code_length: 10
    max_samples_per_split: 10000

models:
  - name: "lightgbm_opt"
    type: "lightgbm"
    params:
      boosting_type: "lightgbm"
      device: "gpu"  # Если упадет, убери эту строку (будет CPU)
      verbose: -1

optimization:
  enabled: true
  n_trials: 50
  timeout: 3600
  metric: "f1_macro"
  search_space:
    learning_rate:
      type: "float"
      low: 0.01
      high: 0.3
      log: true
    num_leaves:
      type: "int"
      low: 20
      high: 150
    max_depth:
      type: "int"
      low: -1
      high: 15
    n_estimators:
      type: "int"
      low: 500
      high: 2000
    min_child_samples:
      type: "int"
      low: 10
      high: 100
    reg_alpha:
      type: "float"
      low: 0.0
      high: 1.0
    reg_lambda:
      type: "float"
      low: 0.0
      high: 1.0

features:
  extractors: ["complexity"]
  remove_constant: true

save_models: true
generate_report: true
